# Azure DevOps step template wrapping the pgproj CLI.
#
# Usage from a pipeline:
#
#   resources:
#     repositories:
#       - repository: pgproj
#         type: github            # or your hosting
#         name: your-org/pgproj
#
#   steps:
#     - template: ci/azure-devops/pgproj-template.yml@pgproj
#       parameters:
#         project: $(Build.SourcesDirectory)/sample/SampleDb/SampleDb.pgproj
#         command: build
#         strict: true
#
# For an approval-gated deploy, run `build` in a CI stage and `publish` in a deployment job that
# targets an Environment with a manual-approval check (Azure DevOps → Environments → Approvals).
# Pass the connection string from a secret variable, never inline. See docs/CICD.md for the full
# rationale and the exit-code contract.

parameters:
  - name: project
    type: string
  - name: command
    type: string
    default: build
    values:
      - build
      - publish
  - name: connection            # required for publish; map from a secret variable
    type: string
    default: ''
  - name: output
    type: string
    default: ''
  - name: dryRun
    type: boolean
    default: false
  - name: strict
    type: boolean
    default: false
  - name: noAnalyze
    type: boolean
    default: false
  - name: allowDrops
    type: boolean
    default: false
  - name: extraArgs
    type: string
    default: ''
  - name: publishCli            # build + publish the CLI before invoking it
    type: boolean
    default: true
  - name: uploadArtifact        # build only: publish model.json as a pipeline artifact
    type: boolean
    default: true
  - name: artifactName
    type: string
    default: pgproj-model

steps:
  - task: UseDotNet@2
    displayName: 'Install .NET 10 SDK'
    inputs:
      packageType: sdk
      version: '10.0.x'

  - ${{ if eq(parameters.publishCli, true) }}:
      - script: |
          dotnet publish src/PgProj.Cli/PgProj.Cli.csproj -c Release -o "$(Agent.TempDirectory)/pgproj"
        displayName: 'Publish pgproj CLI'

  - bash: |
      set -uo pipefail
      cli="dotnet $(Agent.TempDirectory)/pgproj/PgProj.Cli.dll"
      args=("${{ parameters.command }}" "${{ parameters.project }}")

      [ -n "${{ parameters.output }}" ] && args+=("-o" "${{ parameters.output }}")
      [ "${{ lower(parameters.strict) }}"    = "true" ] && args+=("--strict")
      [ "${{ lower(parameters.noAnalyze) }}" = "true" ] && args+=("--no-analyze")

      if [ "${{ parameters.command }}" = "publish" ]; then
        [ "${{ lower(parameters.dryRun) }}"     = "true" ] && args+=("--dry-run")
        [ "${{ lower(parameters.allowDrops) }}" = "true" ] && args+=("--allow-drops")
      fi

      if [ -n "${{ parameters.extraArgs }}" ]; then
        # shellcheck disable=SC2206
        extra=(${{ parameters.extraArgs }})
        args+=("${extra[@]}")
      fi

      echo "##[command]$cli ${args[*]}"
      $cli "${args[@]}"
      code=$?

      # Surface the classified code; let Azure DevOps fail the step on any non-zero (drift=6 too).
      case $code in
        0)  echo "pgproj: success" ;;
        6)  echo "##vso[task.logissue type=warning]pgproj: drift detected (exit 6)" ;;
        *)  [ $code -ne 0 ] && echo "##vso[task.logissue type=error]pgproj exit $code" ;;
      esac
      exit $code
    displayName: 'Run pgproj ${{ parameters.command }}'
    env:
      # The CLI reads PGPROJ_CONNECTION; map a *secret* variable to it so it stays out of logs.
      PGPROJ_CONNECTION: ${{ parameters.connection }}

  - ${{ if and(eq(parameters.command, 'build'), eq(parameters.uploadArtifact, true)) }}:
      - task: PublishPipelineArtifact@1
        displayName: 'Upload model artifact'
        inputs:
          targetPath: '$(Build.SourcesDirectory)'
          artifactName: '${{ parameters.artifactName }}'
